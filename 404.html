<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AeroTower: painel da sua torre hidropônica.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="hidro_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AeroTower</title>
  <link rel="manifest" href="manifest.json">

  <!-- Anti-clickjacking (CT-SEG-03). O GitHub Pages nao deixa mandar o
       cabecalho X-Frame-Options/CSP frame-ancestors, entao a pagina se
       esconde quando e aberta dentro de outro site e tenta sair do quadro. -->
  <style id="anti-clickjacking">html { display: none !important; }</style>
  <script>
    if (window.self === window.top) {
      var trava = document.getElementById('anti-clickjacking');
      trava.parentNode.removeChild(trava);
    } else {
      window.top.location = window.self.location;
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
